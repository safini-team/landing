<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Safini</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="description" content="Get Safini on the App Store or Google Play." />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="canonical" href="https://safini.fun/get" />
  <noscript><meta http-equiv="refresh" content="0;url=/" /></noscript>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/.test(ua);
      if (isIOS) {
        location.replace('https://apps.apple.com/us/app/safini-parental-control/id6761075183');
      } else if (isAndroid) {
        location.replace('https://play.google.com/store/apps/details?id=com.safini.app');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/legal.css" />
  <style>
    .get-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
      text-align: center;
    }
    .get-shell .lockup { height: 32px; }
    .get-stores { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
    .get-stores a {
      display: inline-flex;
      align-items: center;
      padding: 12px 20px;
      border-radius: 14px;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-family: var(--display);
      font-weight: 700;
    }
    .get-stores a:hover { background: var(--pine-deep); }
    .get-shell .back-link { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="get-shell">
    <a href="/"><img class="lockup" src="/assets/safini-logo.png" alt="Safini" /></a>
    <h1>Get Safini</h1>
    <p>Taking you to your app store…</p>
    <div class="get-stores">
      <a href="https://apps.apple.com/us/app/safini-parental-control/id6761075183" rel="noopener">Download on the App Store</a>
      <a href="https://play.google.com/store/apps/details?id=com.safini.app" rel="noopener">Get it on Google Play</a>
    </div>
    <a class="back-link" href="/">← Back to homepage</a>
  </div>
</body>
</html>
